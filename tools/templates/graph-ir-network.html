<script>
"use strict";
(() => {
const DATA=JSON.parse(document.getElementById("graph-data").textContent), G=DATA.graph, C=DATA.constants, L=globalThis.GraphIRLayout;
const $=id=>document.getElementById(id), el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}, btn=(text,fn,cls)=>{const b=el("button",text,cls);b.type="button";b.addEventListener("click",fn);return b;};
const nodeById=new Map(G.nodes.map((n,i)=>[n.id,{...n,index:i}])), producer=new Map(), consumers=new Map();
G.nodes.forEach(n=>{n.outputs.forEach(t=>producer.set(t,n.id));n.inputs.forEach(t=>{if(!consumers.has(t))consumers.set(t,[]);consumers.get(t).push(n.id);});});
const model=L.build(G), rawCount=G.nodes.filter(n=>n.op.includes("::")).length, rawReasons=new Map((G.metadata?.import?.unsupported_nodes??[]).map(n=>[n.node,n.reason]));
const state={scope:"",mode:"scope",offset:0,selected:null,selectedKey:null,view:null,scale:1,panX:0,panY:0,focusRadius:1};
const LIMIT=32, NS="http://www.w3.org/2000/svg";
const svgEl=(tag,attrs={},text)=>{const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));if(text!==undefined)e.textContent=text;return e;};
const short=(s,max=31)=>s.length>max?s.slice(0,max-1)+"…":s, basename=id=>String(id).split("/").filter(Boolean).slice(-2).join("/"), shapeText=s=>s?.shape?"["+s.shape.map(d=>d??"?").join(" × ")+"]":"形状未推导", typeText=t=>{const s=G.value_specs?.[t]??G.inputs?.[t];return s?`${s.dtype} ${shapeText(s)}`:"类型 / 形状未推导";};
const constantName=t=>Object.hasOwn(C,t)?t:DATA.constant_aliases?.[t]?.source, isConst=t=>constantName(t)!==undefined&&Object.hasOwn(C,constantName(t));
const bytes=n=>n>=1048576?(n/1048576).toFixed(2)+" MiB":n>=1024?(n/1024).toFixed(1)+" KiB":n+" B";
const fmt=v=>{if(typeof v!=="number")return String(v);if(!Number.isFinite(v))return String(v);if(v===0)return Object.is(v,-0)?"−0":"0";if(Math.abs(v)>=1e4||Math.abs(v)<1e-3)return v.toExponential(2);return String(Number(v.toPrecision(4)));};
const scopeOf=n=>{if(model.nodeScopes.has(n.id))return model.nodeScopes.get(n.id);const parts=n.id.split("/").filter(Boolean);return parts.length>1?parts.slice(0,-1).join("/"):"";};
const links=DATA.provenance?.artifact_links??{};if(links["graph.ir.txt"])$("text-link").href=links["graph.ir.txt"];
const sourceName=(DATA.report?.model_path??"").split(/[\\/]/).pop();if(sourceName)$("model-title").textContent=sourceName.replace(/\.onnx$/i,"")+" · Graph IR 网络图";
for(const [value,label]of [[G.nodes.length,"算子节点"],[Object.keys(C).length,"权重 / 常量"],[rawCount,"尚未合法化"]]){const span=el("span");span.append(el("strong",value.toLocaleString()),document.createTextNode(" "+label));$("header-meta").append(span);}
$("header-meta").append(el("span","结构与类型来自同一份 Graph IR · 权重显示真实切片"));
const context=DATA.report?.export_report?.details??DATA.scope_report??{};
if(context.scope){$("scope-text").textContent=context.scope.includes("BEVFormer-tiny complete cold")?"前端 Graph IR；固定合成标定的冷帧原始检测头，不含框解码。激活值尚未计算。":"导出范围："+context.scope+"。激活值尚未计算。";}
$("provenance").textContent=JSON.stringify({source:DATA.provenance,scope:context.scope,metadata:context.metadata,note:"模块根据原始节点 scope 聚合；连线由实际 producer / consumer 生成。此页面不执行 MLIR Lowering 或推理。"},null,2);

function transform(){ $("viewport").setAttribute("transform",`translate(${state.panX},${state.panY}) scale(${state.scale})`);$("zoom-label").textContent=Math.round(state.scale*100)+"%"; }
function fit(full=false){
 if(!state.view)return;
 const r=$("canvas-wrap").getBoundingClientRect(),v=state.view;
 const fitted=Math.min((r.width-48)/Math.max(1,v.width),(r.height-65)/Math.max(1,v.height));
 // Keep labels readable on initial load. Full fit is an explicit user action.
 state.scale=Math.min(1.1,Math.max(full===true ? .10 : .85,fitted));
 state.panX=(r.width-v.width*state.scale)/2;
 state.panY=Math.max(20,(r.height-v.height*state.scale)/2);
 transform();
}
function zoom(factor,cx,cy){const r=$("canvas-wrap").getBoundingClientRect();cx??=r.width/2;cy??=r.height/2;const next=Math.max(.08,Math.min(3,state.scale*factor)),ratio=next/state.scale;state.panX=cx-(cx-state.panX)*ratio;state.panY=cy-(cy-state.panY)*ratio;state.scale=next;transform();}
function highlight(){const active=state.selectedKey;$("nodes").querySelectorAll(".dag-node").forEach(e=>e.classList.toggle("selected",e.dataset.key===active));$("edges").querySelectorAll(".edge").forEach(e=>{const selected=e.dataset.source===active||e.dataset.target===active;e.classList.toggle("selected",!!active&&selected);e.classList.toggle("dim",!!active&&!selected);e.setAttribute("marker-end",`url(#${active&&selected?"arrow-active":"arrow"})`);});}
