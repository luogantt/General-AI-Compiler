[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gac-heterogeneous"
version = "0.1.0"
description = "Compiler-runtime co-design prototype for heterogeneous edge inference"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "General AI Compiler contributors" }]
dependencies = ["numpy>=1.26"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
cuda12 = [
  "cupy-cuda12x>=13.4,<14",
  "nvidia-cuda-nvrtc-cu12>=12.6,<13",
  "nvidia-cuda-runtime-cu12>=12.6,<13",
]

[project.scripts]
gac = "gac.cli:main"
gac-bevformer = "gac.tools.build_bevformer:main"
gac-bevformer-export-checkpoint = "gac.tools.export_bevformer_checkpoint:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
